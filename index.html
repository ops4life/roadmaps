@keyframes otto-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes otto-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes otto-pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
@keyframes otto-bubble-in{from{opacity:0;transform:translate(4px,10px)}to{opacity:1;transform:none}}
@keyframes otto-dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

#otto-bot{ position:fixed; right:20px; bottom:20px; z-index:1001; }
#otto-floater{ animation:otto-float 4s ease-in-out infinite; }

#otto-body{ position:absolute; left:0; right:0; top:9px; height:51px; border-radius:4px; background:var(--c-lime); border:2px solid var(--ink); box-shadow:var(--shadow-sm); }
.otto-ear{ position:absolute; top:20px; width:5px; height:13px; border-radius:2px; background:var(--ink); }

.otto-eye-wrap{ display:flex; align-items:center; justify-content:center; }
.otto-eye{ width:7px; height:8px; border-radius:2px; background:var(--c-lime); }
#otto-mouth{ width:13px; height:4px; background:var(--c-lime); border-radius:1px; opacity:.9; }

#otto-greet{ position:fixed; right:92px; bottom:28px; z-index:1000; max-width:190px; background:var(--bg-2); border:var(--border); box-shadow:var(--shadow-sm); border-radius:3px 3px 3px 0; padding:9px 12px; font-size:12.5px; line-height:1.45; color:var(--ink); opacity:0; transform:translate(6px,4px); transition:opacity .2s ease,transform .2s ease; pointer-events:none; }
#otto-greet.show{ opacity:1; transform:none; pointer-events:auto; }

#otto-bubble{ position:fixed; right:20px; bottom:92px; z-index:1000; width:322px; max-width:calc(100vw - 40px); background:var(--bg-2); border:var(--border); box-shadow:var(--shadow-lg); border-radius:5px 5px 5px 0; overflow:hidden; color:var(--ink); animation:otto-bubble-in .18s ease-out; display:none; }
#otto-bubble.otto-open{ display:block; }

.otto-dots span:nth-child(3){ animation:otto-dot 1s infinite .36s; }

.otto-chip{ font:inherit; font-size:11.5px; font-weight:700; padding:6px 11px; border-radius:980px; background:var(--bg); border:2px solid var(--ink); color:var(--ink); cursor:pointer; white-space:nowrap; flex-shrink:0; transition:transform .1s ease,box-shadow .1s ease; }
.otto-chip:hover{ background:var(--c-yellow); transform:translate(-1px,-1px); box-shadow:var(--shadow-sm); }

#otto-tour{ position:fixed; inset:0; z-index:1200; display:none; pointer-events:none; }

#otto-spotlight{ position:fixed; border-radius:4px; box-shadow:0 0 0 9999px rgba(26,23,20,.68); border:2px solid var(--c-lime); transition:all .35s cubic-bezier(.2,.8,.2,1); pointer-events:none; }

.otto-tooltip-inner{ background:var(--bg-2); border:var(--border); box-shadow:var(--shadow-lg); border-radius:5px; padding:14px 14px 12px; color:var(--ink); }
.otto-tip-head{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
.otto-avatar-tip{ width:26px; height:26px; border-radius:3px; background:var(--ink); border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; gap:4px; flex-shrink:0; }

#otto-tour-next{ font:inherit; font-size:12.5px; font-weight:700; color:var(--ink); background:var(--c-lime); border:2px solid var(--ink); cursor:pointer; padding:7px 16px; border-radius:980px; transition:transform .1s ease,box-shadow .1s ease; }
#otto-tour-next:hover{ transform:translate(-1px,-1px); box-shadow:var(--shadow-sm); }

  #otto-bot{ right:14px; bottom:14px; }
  #otto-bubble{ right:14px; bottom:82px; }

}

const { useState, useEffect, useLayoutEffect, useRef, useMemo, useCallback } = React;

// ── HOOKS ─────────────────────────────────────────────────────────────
function useStored(key, init) {
  const [val, setVal] = useState(() => {
    try { const raw = localStorage.getItem(key); return raw === null ? init : JSON.parse(raw); }
    catch { return init; }
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }, [key, val]);
  return [val, setVal];
}

// ── DATA ──────────────────────────────────────────────────────────────
const TRACKS = [TRACK_DEVOPS, TRACK_DEVSECOPS, TRACK_MLOPS, TRACK_DEVOPS_TO_MLOPS, TRACK_AWS_CERT, TRACK_AZ_CERT];

// ── ICONS ─────────────────────────────────────────────────────────────
const Icon = {

  Grid:    (p) => <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" {...p}><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/></svg>,
  List:    (p) => <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" {...p}><path d="M3 4h10M3 8h10M3 12h10"/></svg>,
  Bulb:    (p) => <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M6 13h4M5 10a4 4 0 116 0c0 1-1 1.5-1 2.5H6c0-1-1-1.5-1-2.5z"/></svg>,
  Logo:    (p) => <svg viewBox="0 0 512 512" width="20" height="20" {...p}><path fill="currentColor" d="M224.3-2.5c19.8-11.4 44.2-11.4 64 0L464.2 99c19.8 11.4 32 32.6 32 55.4v203c0 22.9-12.2 44-32 55.4L288.3 514.5a64.16 64.16 0 0 1-64 0L48.5 413c-19.8-11.4-32-32.6-32-55.4v-203c0-22.9 12.2-44 32-55.4zm207.8 360V191.4l-143.8 83v166.1z"/></svg>,
  Ext:     (p) => <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M6 3H3v10h10v-3M9 3h4v4M8 8l5-5"/></svg>,

// ── PRIMITIVES ────────────────────────────────────────────────────────
function Btn({ children, variant="primary", size="md", onClick, style, disabled, ...rest }) {
  const sizes = { sm:{h:30,px:11,fs:11.5}, md:{h:38,px:16,fs:12.5}, lg:{h:48,px:22,fs:14} };
  const s = sizes[size];
  const variants = {
    primary:   { bg:"var(--ink)",      color:"var(--bg)" },
    secondary: { bg:"var(--bg-2)",     color:"var(--ink)" },
    accent:    { bg:"var(--c-yellow)", color:"var(--ink)" },
    ghost:     { bg:"transparent",     color:"var(--ink)" },
  };
  const v = variants[variant] || variants.primary;
  return (
    <button onClick={onClick} disabled={disabled} {...rest}
      className="brut-sm brut-hover brut-press"
      style={{
        appearance:"none", cursor:disabled?"not-allowed":"pointer",
        background:v.bg, color:v.color,
        height:s.h, padding:`0 ${s.px}px`,
        fontSize:s.fs, fontWeight:700, fontFamily:"inherit",
        textTransform:"uppercase", letterSpacing:".06em",
        display:"inline-flex", alignItems:"center", gap:8,
        opacity:disabled?.5:1,
        ...style,
      }}
    >{children}</button>
  );
}

function Tag({ children, color="var(--bg-3)", style }) {
  return (
    <span style={{
      display:"inline-flex", alignItems:"center", gap:6,
      padding:"3px 7px", border:"1.5px solid var(--ink)",
      background:color, color:"var(--ink)",
      fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:".10em",
      ...style,
    }}>{children}</span>
  );
}

// ── TRACK SWITCHER ────────────────────────────────────────────────────
function TrackSwitcher({ track, onTrackChange, onShowPicker }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);

  return (
    <div ref={ref} className="track-switcher" style={{position:"relative", minWidth:0}}>
      <button onClick={() => setOpen(o => !o)} className="brut-sm brut-hover brut-press track-switcher-btn" style={{
        appearance:"none", cursor:"pointer", fontFamily:"inherit",
        display:"inline-flex", alignItems:"center", gap:9,
        height:36, padding:"0 11px", maxWidth:"100%",
        background:"var(--bg-2)", color:"var(--ink)", borderWidth:"1.5px",
        fontSize:12, fontWeight:700, letterSpacing:".05em", textTransform:"uppercase",
      }}>
        <span style={{ width:10, height:10, flex:"none", background:track.accent, border:"1.5px solid var(--ink)" }} />
        <span style={{ overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", minWidth:0 }}>{track.title}</span>
        <Icon.Chevron style={{flex:"none", transform: open ? "rotate(180deg)" : "none", transition:"transform .12s ease"}} />
      </button>

      {open && (
        <div className="brut track-switcher-panel" style={{
          position:"absolute", top:"calc(100% + 8px)", right:0, zIndex:40,
          width:"max(240px, 100%)", maxWidth:"min(320px, calc(100vw - 32px))",
          background:"var(--bg-2)", padding:6,
          display:"flex", flexDirection:"column", gap:2,
        }}>
          {TRACKS.map(t => {
            const active = t.id === track.id;
            return (
              <button key={t.id}
                onClick={() => { onTrackChange(t.id); setOpen(false); }}
                style={{
                  appearance:"none", cursor:"pointer", fontFamily:"inherit",
                  display:"flex", alignItems:"center", gap:11,
                  padding:"9px 10px", border:"none",
                  background: active ? "var(--ink)" : "transparent",
                  color: active ? "var(--bg)" : "var(--ink)",
                  textAlign:"left",
                }}
                onMouseEnter={e => { if (!active) e.currentTarget.style.background="var(--bg-3)"; }}
                onMouseLeave={e => { if (!active) e.currentTarget.style.background="transparent"; }}>
                <span style={{ width:12, height:12, background:t.accent, border:"1.5px solid " + (active ? "var(--bg)" : "var(--ink)"), flex:"none" }} />
                <span style={{display:"flex", flexDirection:"column", gap:2, minWidth:0, flex:1}}>
                  <span style={{ fontSize:12, fontWeight:700, letterSpacing:".05em", textTransform:"uppercase" }}>{t.title}</span>
                  <span style={{ fontSize:10.5, fontWeight:400, letterSpacing:".02em", color: active ? "var(--bg-3)" : "var(--ink-3)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{t.tagline}</span>
                </span>
              </button>
            );
          })}
          <div style={{height:1.5, background:"var(--ink)", margin:"6px 4px"}} />
          <button
            onClick={() => { onShowPicker(); setOpen(false); }}
            style={{
              appearance:"none", cursor:"pointer", fontFamily:"inherit",
              display:"flex", alignItems:"center", gap:8,
              padding:"8px 10px", border:"none", background:"transparent",
              color:"var(--ink-2)", textAlign:"left",
              fontSize:11.5, fontWeight:700, letterSpacing:".06em", textTransform:"uppercase",
            }}
            onMouseEnter={e => { e.currentTarget.style.background="var(--bg-3)"; e.currentTarget.style.color="var(--ink)"; }}
            onMouseLeave={e => { e.currentTarget.style.background="transparent"; e.currentTarget.style.color="var(--ink-2)"; }}>
            <Icon.Back />
            <span>All tracks</span>
          </button>
        </div>
      )}
    </div>
  );
}

function statusOf(progress, id) {
  if (progress.done?.[id]) return "done";
  if (progress.learning?.[id]) return "learning";
  return "todo";
}

const NodeCard = React.forwardRef(function NodeCard({ item, status, color, faded, onOpen }, ref) {
  const isAlt = item.type === "alt";
  const bg = status === "done" ? "var(--done-bg)" : "var(--bg-2)";
  return (
    <button ref={ref} onClick={() => onOpen(item)}
      data-node-id={item.id}
      className="brut-sm brut-hover brut-press"
      style={{
        appearance:"none", cursor:"pointer", textAlign:"left",
        display:"flex", alignItems:"center", gap:11,
        width:"100%", padding:"var(--pad-node-y) var(--pad-node-x)",
        background:bg, color:"var(--ink)", fontFamily:"inherit",

        background: status==="done" ? "var(--done)" : status==="learning" ? "var(--learning)" : "var(--bg)",
        display:"grid", placeItems:"center", flex:"none",
      }}>
        {status==="done" && <Icon.Check />}
        {status==="learning" && <span style={{width:6, height:6, background:"var(--ink)"}} />}
      </span>
      <span style={{ flex:1, minWidth:0, fontSize:12.5, fontWeight:700, letterSpacing:".01em", color:"var(--ink)" }}>{item.label}</span>
      {isAlt && (
        <span style={{ fontSize:9.5, fontWeight:700, padding:"2px 6px", border:"1.5px solid var(--ink)", background:"var(--bg)", textTransform:"uppercase", letterSpacing:".10em", color:"var(--ink-2)" }}>ALT</span>
      )}
    </button>
  );
});

function SectionColumn({ section, progress, query, onOpen, headerRef }) {
  const [num, ...rest] = section.title.split(" · ");
  const label = rest.join(" · ");
  return (
    <div style={{display:"flex", flexDirection:"column", gap:"var(--gap-node)", minWidth:0}}>
      <div ref={headerRef} className="brut" style={{ padding:"14px 16px 12px", background:section.color, color:"var(--ink)", display:"flex", flexDirection:"column", gap:4 }}>
        <div style={{display:"flex", alignItems:"baseline", justifyContent:"space-between", gap:8}}>
          <span className="display-mid" style={{fontSize:13, letterSpacing:".02em", color:"var(--ink-2)"}}>{num}</span>
          <span style={{fontSize:10, fontWeight:700, color:"var(--ink-2)", letterSpacing:".10em", textTransform:"uppercase"}}>{section.items.length} nodes</span>
        </div>
        <div className="display-mid" style={{fontSize:19, lineHeight:1.05, color:"var(--ink)"}}>{label}</div>
      </div>
      <div style={{display:"flex", flexDirection:"column", gap:"var(--gap-node)"}}>
        {section.items.map(item => {
          const faded = query && !item.label.toLowerCase().includes(query.toLowerCase())
                              && !(item.tools||[]).join(" ").toLowerCase().includes(query.toLowerCase())
                              && !(item.concepts||[]).join(" ").toLowerCase().includes(query.toLowerCase());
          return (
            <NodeCard key={item.id} item={item}
              status={statusOf(progress, item.id)}
              color={section.color}
              faded={faded}
              onOpen={onOpen} />
          );
        })}
      </div>
    </div>
  );
}

function Board({ track, progress, query, onOpen }) {
  const wrapRef = useRef(null);
  const headerRefs = useRef({});
  const [paths, setPaths] = useState([]);

  const draw = useCallback(() => {
    if (!wrapRef.current) return;
    const wrap = wrapRef.current.getBoundingClientRect();
    const sections = track.sections;
    const newPaths = [];
    for (let i = 0; i < sections.length - 1; i++) {
      const a = headerRefs.current[sections[i].id];
      const b = headerRefs.current[sections[i+1].id];
      if (!a || !b) continue;
      const ar = a.getBoundingClientRect();
      const br = b.getBoundingClientRect();
      const x1 = ar.right - wrap.left;
      const y1 = ar.top + ar.height/2 - wrap.top;
      const x2 = br.left - wrap.left;
      const y2 = br.top + br.height/2 - wrap.top;
      const dx = (x2 - x1) * 0.5;
      newPaths.push({ d:`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`, color: sections[i+1].color });
    }
    setPaths(newPaths);
  }, [track]);

  useEffect(() => {
    draw();
    const ro = new ResizeObserver(draw);
    if (wrapRef.current) ro.observe(wrapRef.current);
    window.addEventListener("resize", draw);
    return () => { ro.disconnect(); window.removeEventListener("resize", draw); };
  }, [draw]);

  useEffect(() => { const id = setTimeout(draw, 50); return () => clearTimeout(id); }, [track.id, draw]);

  return (
    <div ref={wrapRef} style={{position:"relative"}}>
      <svg style={{ position:"absolute", inset:0, width:"100%", height:"100%", pointerEvents:"none", overflow:"visible" }}>
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="var(--ink)" />
          </marker>
        </defs>
        {paths.map((p, i) => (
          <path key={i} d={p.d} fill="none" stroke="var(--ink)" strokeWidth="2" markerEnd="url(#arrow)" strokeLinecap="round" />
        ))}
      </svg>
      <div style={{ display:"grid", gridTemplateColumns:`repeat(${track.sections.length}, minmax(200px, 1fr))`, gap:"var(--gap-section)", alignItems:"start" }}>
        {track.sections.map(s => (
          <SectionColumn key={s.id}
            section={s} progress={progress} query={query} onOpen={onOpen}
            headerRef={el => { headerRefs.current[s.id] = el; }} />
        ))}
      </div>
    </div>
  );
}

function HighlightableText({ text, pageKey, pageLabel, itemId, itemLabel, notes, setNotes }) {
  const ref = useRef(null);
  const tipRef = useRef(null);
  const [tip, setTip] = useState(null); // { rect, text }
  const [noteMode, setNoteMode] = useState(false);
  const [draft, setDraft] = useState("");

  const itemNotes = useMemo(
    () => notes.filter(n => n.page === pageKey && n.itemId === itemId && n.scope !== "content"),
    [notes, pageKey, itemId]
  );

  useEffect(() => {
    const onMouseUp = (e) => {
      if (tipRef.current && tipRef.current.contains(e.target)) return;
      const el = ref.current;
      const sel = window.getSelection();
      const t = sel && sel.toString().trim();
      if (!el || !t || t.length < 2 || !sel.anchorNode || !el.contains(sel.anchorNode)) {
        setTip(null);
        return;
      }
      setTip({ rect: sel.getRangeAt(0).getBoundingClientRect(), text: t });
      setNoteMode(false);
      setDraft("");
    };
    // Mobile doesn't fire mouseup for touch-based text selection, and the
    // selection itself isn't finalized until just after touchend fires — the
    // setTimeout(0) lets it settle before we read window.getSelection().
    const onTouchEnd = (e) => setTimeout(() => onMouseUp(e), 0);
    document.addEventListener("mouseup", onMouseUp);
    document.addEventListener("touchend", onTouchEnd);
    return () => {
      document.removeEventListener("mouseup", onMouseUp);
      document.removeEventListener("touchend", onTouchEnd);
    };
  }, []);

  function commit(noteText) {
    if (!tip) return;
    setNotes(list => [...list, {
      id: "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      page: pageKey, pageLabel, itemId, itemLabel, scope: "description",
      text: tip.text, note: noteText || "", createdAt: Date.now(),
    }]);
    setTip(null);
    setNoteMode(false);
  }

  function openAISearch() {
    if (!tip) return;
    const q = `${pageLabel}: ${tip.text}`;
    const url = `https://www.google.com/search?q=${encodeURIComponent(q)}&udm=50`;
    window.open(url, "rm-ai-search", "width=700,height=640,resizable=yes,scrollbars=yes");
    setTip(null);
  }

  const segments = useMemo(() => {
    if (!itemNotes.length) return [{ str: text, marked: false }];
    let parts = [{ str: text, marked: false }];
    itemNotes.forEach(n => {
      if (!n.text) return;
      const next = [];
      parts.forEach(p => {
        if (p.marked) { next.push(p); return; }
        const idx = p.str.indexOf(n.text);
        if (idx === -1) { next.push(p); return; }
        if (idx > 0) next.push({ str: p.str.slice(0, idx), marked: false });
        next.push({ str: n.text, marked: true, id: n.id });
        const rest = p.str.slice(idx + n.text.length);
        if (rest) next.push({ str: rest, marked: false });
      });
      parts = next;
    });
    return parts;
  }, [text, itemNotes]);

  return (
    <div ref={ref} style={{ position: "relative" }}>
      <p style={{margin:"0 0 22px", fontSize:14, color:"var(--ink-2)", lineHeight:1.55}}>
        {segments.map((seg, i) => seg.marked
          ? <mark key={seg.id || i} style={{ background:"var(--c-yellow)", padding:"0 2px" }}>{seg.str}</mark>
          : <React.Fragment key={i}>{seg.str}</React.Fragment>)}
      </p>

      <SelectionTip
        tipRef={tipRef} tip={tip} noteMode={noteMode} setNoteMode={setNoteMode}
        draft={draft} setDraft={setDraft}
        onHighlight={() => commit("")} onSave={() => commit(draft.trim())} onAISearch={openAISearch}
      />
    </div>
  );
}

// Floating Highlight/Note/AI-Search popover shown on text selection.
// Renders hidden first, measures its own height, then places itself above
// the selection (or below, if there isn't room above) — using the real
// rendered height rather than a guessed constant avoids the popover ever
// landing on top of the selected text it's opening below/above.
function SelectionTip({ tipRef, tip, noteMode, setNoteMode, draft, setDraft, onHighlight, onSave, onAISearch }) {
  const [pos, setPos] = useState(null);
  const [entered, setEntered] = useState(false);

  useLayoutEffect(() => {
    if (!tip) { setPos(null); setEntered(false); return; }
    const el = tipRef.current;
    if (!el) return;
    const gap = 8;
    const height = el.offsetHeight;
    const top = (tip.rect.top - gap >= height)
      ? tip.rect.top - height
      : Math.min(tip.rect.bottom + gap, window.innerHeight - height - gap);
    const left = Math.min(Math.max(8, tip.rect.left), window.innerWidth - 248);
    setPos({ top, left });
  }, [tip, noteMode, draft]);

  // Fade/slide in only after `pos` is committed and painted once, otherwise
  // the transition would be skipped (position and opacity would land in the
  // same frame, so the browser has nothing to animate from).
  useEffect(() => {
    if (!pos) return;
    const id = requestAnimationFrame(() => setEntered(true));
    return () => cancelAnimationFrame(id);
  }, [pos]);

  if (!tip) return null;
  return (
    <div ref={tipRef} className="brut" style={{
      position:"fixed", zIndex:9100,
      top: pos ? pos.top : -9999, left: pos ? pos.left : -9999,
      visibility: pos ? "visible" : "hidden",
      opacity: entered ? 1 : 0,
      transform: entered ? "translateY(0)" : "translateY(4px)",
      transition: "opacity .12s ease, transform .12s ease",
      background:"var(--bg-2)", padding:8, width:240,
      display:"flex", flexDirection:"column", gap:6,
    }}>
      {!noteMode ? (
        <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
          <Btn size="sm" variant="secondary" onClick={onHighlight}>✏️ Highlight</Btn>
          <Btn size="sm" variant="secondary" onClick={() => setNoteMode(true)}>📝 Note</Btn>
          <Btn size="sm" variant="secondary" onClick={onAISearch}>🔍 AI Search</Btn>
        </div>
      ) : (
        <div style={{display:"flex", flexDirection:"column", gap:6}}>
          <textarea autoFocus rows={3} value={draft} onChange={e => setDraft(e.target.value)}
            placeholder="Add a note…"
            style={{fontFamily:"inherit", fontSize:12, border:"1.5px solid var(--ink)", padding:6, resize:"vertical"}} />
          <Btn size="sm" onClick={onSave}>Save</Btn>
        </div>
      )}
    </div>
  );
}

// ── HIGHLIGHTABLE GUIDE CONTENT (rich HTML — DOM-based mark injection) ──
function collectHighlightableTextNodes(root) {
  const nodes = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      let p = node.parentNode;
      while (p && p !== root) {
        if (p.tagName === "MARK" || p.tagName === "CODE" || p.tagName === "PRE") return NodeFilter.FILTER_REJECT;
        p = p.parentNode;
      }
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  let n;
  while ((n = walker.nextNode())) nodes.push(n);
  return nodes;
}

function applyStoredHighlight(textNodes, note) {
  const needle = note.text;
  if (!needle) return;
  for (let i = 0; i < textNodes.length; i++) {
    const node = textNodes[i];
    const val = node.nodeValue;
    const idx = val.indexOf(needle);
    if (idx === -1) continue;
    const mark = document.createElement("mark");
    mark.className = "rm-guide-highlight";
    mark.dataset.noteId = note.id;
    mark.textContent = needle;
    const parent = node.parentNode;
    if (idx > 0) parent.insertBefore(document.createTextNode(val.slice(0, idx)), node);
    parent.insertBefore(mark, node);
    const rest = val.slice(idx + needle.length);
    if (rest) {
      const tail = document.createTextNode(rest);
      parent.insertBefore(tail, node);
      textNodes[i] = tail;
    } else {
      textNodes.splice(i, 1);
    }
    parent.removeChild(node);
    return;
  }
}

function GuideContent({ html, pageKey, pageLabel, itemId, itemLabel, notes, setNotes }) {
  const ref = useRef(null);
  const tipRef = useRef(null);
  const [tip, setTip] = useState(null); // { rect, text, range }
  const [noteMode, setNoteMode] = useState(false);
  const [draft, setDraft] = useState("");

  const itemNotes = useMemo(
    () => notes.filter(n => n.page === pageKey && n.itemId === itemId && n.scope === "content"),
    [notes, pageKey, itemId]
  );

  // Re-apply persisted highlights into the raw HTML after each mount/update —
  // dangerouslySetInnerHTML only touches the DOM when `html` itself changes,
  // so this is safe to re-run whenever the note list changes.
  useEffect(() => {
    const root = ref.current;
    if (!root || !itemNotes.length) return;
    const textNodes = collectHighlightableTextNodes(root);
    itemNotes.forEach(n => applyStoredHighlight(textNodes, n));
  }, [html, itemNotes]);

  // Inject a copy button into every <pre> code block in the guide content.
  useEffect(() => {
    const root = ref.current;
    if (!root) return;
    root.querySelectorAll("pre").forEach(pre => {
      if (pre.querySelector(".rm-copy-btn")) return;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "rm-copy-btn";
      btn.textContent = "Copy";
      btn.addEventListener("click", () => {
        const code = pre.querySelector("code") || pre;
        navigator.clipboard.writeText(code.textContent).then(() => {
          btn.textContent = "Copied!";
          btn.classList.add("copied");
          setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1500);
        });
      });
      pre.appendChild(btn);
    });
  }, [html]);

  useEffect(() => {
    const onMouseUp = (e) => {
      if (tipRef.current && tipRef.current.contains(e.target)) return;
      const root = ref.current;
      const sel = window.getSelection();
      const t = sel && sel.toString().trim();
      if (!root || !t || t.length < 2 || !sel.anchorNode || !root.contains(sel.anchorNode) || sel.rangeCount === 0) {
        setTip(null);
        return;
      }
      setTip({ rect: sel.getRangeAt(0).getBoundingClientRect(), text: t, range: sel.getRangeAt(0).cloneRange() });
      setNoteMode(false);
      setDraft("");
    };
    // Mobile doesn't fire mouseup for touch-based text selection, and the
    // selection itself isn't finalized until just after touchend fires — the
    // setTimeout(0) lets it settle before we read window.getSelection().
    const onTouchEnd = (e) => setTimeout(() => onMouseUp(e), 0);
    document.addEventListener("mouseup", onMouseUp);
    document.addEventListener("touchend", onTouchEnd);
    return () => {
      document.removeEventListener("mouseup", onMouseUp);
      document.removeEventListener("touchend", onTouchEnd);
    };
  }, []);

  function commit(noteText) {
    if (!tip) return;
    try {
      const mark = document.createElement("mark");
      mark.className = "rm-guide-highlight";
      tip.range.surroundContents(mark);
    } catch (e) {
      // Selection crossed element boundaries (e.g. spans a bold run) — the
      // effect above will still wrap the plain-text substring on the next
      // note-list update as a best-effort fallback.
    }
    setNotes(list => [...list, {
      id: "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      page: pageKey, pageLabel, itemId, itemLabel, scope: "content",
      text: tip.text, note: noteText || "", createdAt: Date.now(),
    }]);
    window.getSelection().removeAllRanges();
    setTip(null);
    setNoteMode(false);
  }

  function openAISearch() {
    if (!tip) return;
    const q = `${pageLabel}: ${tip.text}`;
    const url = `https://www.google.com/search?q=${encodeURIComponent(q)}&udm=50`;
    window.open(url, "rm-ai-search", "width=700,height=640,resizable=yes,scrollbars=yes");
    setTip(null);
  }

  return (
    <div style={{ position:"relative" }}>
      <div ref={ref} className="guide-embed" dangerouslySetInnerHTML={{ __html: html }} />

      <SelectionTip
        tipRef={tipRef} tip={tip} noteMode={noteMode} setNoteMode={setNoteMode}
        draft={draft} setDraft={setDraft}
        onHighlight={() => commit("")} onSave={() => commit(draft.trim())} onAISearch={openAISearch}
      />
    </div>
  );
}

const LIST_UUID = "00a8f2c1-3ad4-422d-9ac4-fc70b1f26fc8";

function Newsletter() {
  const [email, setEmail] = useState("");
  const [status, setStatus] = useState(null);
  const [loading, setLoading] = useState(false);

  const subscribe = async () => {
    const v = email.trim();
    if (!v || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
      setStatus({ ok:false, msg:"Enter a valid email address." });
      return;
    }
    setLoading(true);
    setStatus(null);
    try {
      const res = await fetch("/api/subscribe", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ email:v, list_uuids:[LIST_UUID] }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        setStatus({ ok:true, msg:"Check your inbox to confirm." });
        setEmail("");
      } else if (res.status === 409) {
        setStatus({ ok:false, msg: data?.error || "Already subscribed." });
      } else {
        setStatus({ ok:false, msg:"Something went wrong. Try again." });
      }
    } catch {
      setStatus({ ok:false, msg:"Could not connect. Try again." });
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{borderTop:"2px solid var(--ink)", padding:"28px 22px", background:"var(--bg-2)"}}>
      <div style={{maxWidth:560}}>
        <div className="display-mid" style={{fontSize:22, marginBottom:6}}>Stay in the loop</div>
        <p style={{fontSize:12, color:"var(--ink-3)", marginBottom:16}}>Get notified when new roadmaps and updates drop.</p>
        <div className="nl-row" style={{display:"flex", gap:8}}>
          <input
            type="email" value={email}
            onChange={e => setEmail(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") subscribe(); }}
            placeholder="your@email.com"
            className="brut-sm"
            style={{
              flex:1, minWidth:0,
              fontFamily:"inherit", fontSize:12, color:"var(--ink)",
              background:"var(--bg)", padding:"0 12px", height:38,
              border:"1.5px solid var(--ink)", outline:"none",
            }} />
          <Btn onClick={subscribe} disabled={loading} size="md">
            {loading ? "..." : "Subscribe"}
          </Btn>
        </div>
        {status && (
          <div style={{ marginTop:10, fontSize:12, color: status.ok ? "oklch(0.55 0.16 145)" : "oklch(0.55 0.20 25)" }}>
            {status.msg}
          </div>
        )}
      </div>
      <style>{`@media (max-width: 480px){ .nl-row{ flex-direction: column } }`}</style>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────
function App() {
  const [trackId, setTrackId] = useStored("ops4life:active-track", null);
  const [view, setView] = useState("grid");
  const [query, setQuery] = useState("");
  const [openItem, setOpenItem] = useState(null);
  const [notes, setNotes] = useStored("roadmap_notes", []);
  const [notesOpen, setNotesOpen] = useState(false);
  const [feedbackOpen, setFeedbackOpen] = useState(false);

  useEffect(() => {
    const mq = window.matchMedia("(max-width: 768px)");
    const apply = () => { if (mq.matches) setView("list"); };
    apply();
    mq.addEventListener?.("change", apply);
    return () => mq.removeEventListener?.("change", apply);
  }, []);

  const p0 = useStored(TRACKS[0].storageKey, { learning:{}, done:{} });
  const p1 = useStored(TRACKS[1].storageKey, { learning:{}, done:{} });
  const p2 = useStored(TRACKS[2].storageKey, { learning:{}, done:{} });
  const p3 = useStored(TRACKS[3].storageKey, { learning:{}, done:{} });
  const p4 = useStored(TRACKS[4].storageKey, { learning:{}, done:{} });
  const p5 = useStored(TRACKS[5].storageKey, { learning:{}, done:{} });
  const progressByTrack = {
    [TRACKS[0].id]: p0[0], [TRACKS[1].id]: p1[0], [TRACKS[2].id]: p2[0], [TRACKS[3].id]: p3[0],
    [TRACKS[4].id]: p4[0], [TRACKS[5].id]: p5[0],
  };
  const setProgressByTrack = {
    [TRACKS[0].id]: p0[1], [TRACKS[1].id]: p1[1], [TRACKS[2].id]: p2[1], [TRACKS[3].id]: p3[1],
    [TRACKS[4].id]: p4[1], [TRACKS[5].id]: p5[1],
  };

  const track = useMemo(() => trackId ? TRACKS.find(tr => tr.id === trackId) : null, [trackId]);
  const progress = track ? progressByTrack[track.id] : { learning:{}, done:{} };
  const setProgress = track ? setProgressByTrack[track.id] : (() => {});

  const totalCount = track ? track.sections.reduce((a, s) => a + s.items.length, 0) : 0;
  const doneCount = Object.values(progress.done || {}).filter(Boolean).length;
  const percent = totalCount ? Math.round((doneCount / totalCount) * 100) : 0;

  const onMark = (id, kind) => {
    setProgress(p => {
      const next = { learning:{...(p.learning||{})}, done:{...(p.done||{})} };
      if (kind === "done") {
        next.done[id] = !next.done[id];
        if (next.done[id]) next.learning[id] = false;
      } else if (kind === "learning") {
        next.learning[id] = !next.learning[id];
        if (next.learning[id]) next.done[id] = false;
      }
      return next;
    });
  };

  const sectionOf = (item) => track?.sections.find(s => s.items.some(i => i.id === item.id));
  const flatItems = useMemo(() => track ? track.sections.flatMap(s => s.items) : [], [track]);
  const openIndex = openItem ? flatItems.findIndex(i => i.id === openItem.id) : -1;
  const prevItem = openIndex > 0 ? flatItems[openIndex - 1] : null;
  const nextItem = openIndex >= 0 && openIndex < flatItems.length - 1 ? flatItems[openIndex + 1] : null;
  const showPicker = () => { setTrackId(null); setOpenItem(null); setQuery(""); window.scrollTo({top:0}); };
  const choose = (id) => { setTrackId(id); window.scrollTo({top:0}); };

  const trackNotesCount = track ? notes.filter(n => n.page === track.id).length : notes.length;
  const handleJumpToNote = (n) => {
    const targetTrack = TRACKS.find(t => t.id === n.page);
    if (!targetTrack) return;
    const targetItem = targetTrack.sections.flatMap(s => s.items).find(i => i.id === n.itemId);
    if (targetTrack.id !== trackId) setTrackId(targetTrack.id);
    if (targetItem) setOpenItem(targetItem);
    setNotesOpen(false);
  };

  return (
    <div style={{minHeight:"100vh"}}>
      <Header track={track} onTrackChange={choose} onShowPicker={showPicker}
        query={query} setQuery={setQuery}
        view={view} setView={setView}
        percent={percent}
        notesCount={trackNotesCount} onOpenNotes={() => setNotesOpen(true)} />

      {!track && <TrackPicker onChoose={choose} progressByTrack={progressByTrack} />}

      {track && (
        <Hero track={track} percent={percent} doneCount={doneCount} totalCount={totalCount} />
      )}

      {track && (
        <main className="board-main" style={{
          maxWidth:1320, margin:"0 auto",
          padding:"16px 22px 60px",
          overflowX: view==="grid" ? "auto" : "visible",
        }}>
          {view === "grid"
            ? <Board track={track} progress={progress} query={query} onOpen={setOpenItem} />
            : <ListView track={track} progress={progress} query={query} onOpen={setOpenItem} />}
        </main>
      )}

      <Footer onFeedbackClick={() => setFeedbackOpen(true)} />

      <Drawer
        open={!!openItem}
        item={openItem}
        section={openItem ? sectionOf(openItem) : null}
        status={openItem ? statusOf(progress, openItem.id) : "todo"}
        wide={track?.id === "aws-cert" || track?.id === "az-cert"}
        onClose={() => setOpenItem(null)}
        onMark={onMark}
        onPrev={prevItem ? () => setOpenItem(prevItem) : null}
        onNext={nextItem ? () => setOpenItem(nextItem) : null}
        pageKey={track?.id} pageLabel={track?.title}
        notes={notes} setNotes={setNotes} />

      <NotesPanel
        open={notesOpen}
        onClose={() => setNotesOpen(false)}
        notes={notes} setNotes={setNotes}
        track={track}
        onJump={handleJumpToNote} />

      <Feedback open={feedbackOpen} onClose={() => setFeedbackOpen(false)} />

      <style>{`
        @media (max-width: 560px){ .board-main{ padding: 14px 14px 56px !important } }
      `}</style>
    </div>
  );
}

<script>
(() => {
  const BOT_NAME = "Otto";

  const ALL_STEPS = [
    { sel: ".picker-grid", title: "Pick a track", text: "Six learning tracks — DevOps, DevSecOps, MLOps, and AWS/Azure cert prep. Click any card to dive in." },
    { sel: ".header-progress", title: "Track your progress", text: "This badge shows how far you've gotten. Mark items Learning or Done inside a guide to fill it up." },
    { sel: "#rm-notes-btn", title: "Notes & highlights", text: "Select text in any guide to save a highlight or note. Open this panel anytime to review or jump back to them." },
    { sel: ".board-main", title: "Explore the board", text: "Click any node for its full guide — description, concepts, tools, resources, and an AI search shortcut." },
  ];

  const CHIP_GROUPS = {
    default: [
      { key: "tour", label: "🧭 Take the Tour" },
      { key: "about", label: "❓ What is this?" },
      { key: "tracks", label: "🗺️ How tracks work" },
      { key: "progress", label: "📊 Progress tracking" },
      { key: "notes", label: "📝 Notes & Highlights" },
      { key: "aisearch", label: "🔍 AI Search" },
      { key: "feedback", label: "💬 Feedback" },
    ],
  };

  const ANSWERS = {
    about: "Roadmap is ops4life's free interactive learning tracker — six tracks (DevOps, DevSecOps, MLOps, DevOps→MLOps, AWS SAP-C02, Azure AZ-104) with guided topics, resources, and progress tracking, all in your browser.",
    tracks: "Pick a track to open its board — topics organized into sections. Click any node to open its guide: description, concepts, tools, and resources. Mark items Learning or Done as you go.",
    progress: "Your % complete shows in the header and updates as you mark items Learning/Done. Progress is saved per-track in your browser's local storage — no account needed, but it won't follow you to another device.",
    notes: "Select any text in a guide to Highlight it or add a Note. Open the Notes panel from the header button to review everything you've saved, jump back to it, or filter by This Track / All Tracks.",
    aisearch: "Every concept and tool chip links to Google's AI-mode search, so you can dig deeper on any topic in one click without leaving your flow.",
    feedback: "Spot something wrong or have a suggestion? Use the feedback link in the footer to open a GitHub issue or discussion directly.",
  };

  const IDLE_GREETINGS = [
    "Hi! I'm Otto. Want a 20-second tour of Roadmap?",
    "Psst — not sure where to start? I can help.",
    "New here? I can walk you through the tracks.",
    "Curious how progress tracking works? Ask me.",
    "Hey! Click me if you want a quick tour.",
  ];

  let bubbleOpen = false, greeted = false;
  let tourActive = false, stepIndex = 0, steps = [];
  let botRef = null, mouse = null, rafId = null;

  const $ = (id) => document.getElementById(id);
  const greetEl = $("otto-greet");
  const bubble = $("otto-bubble");
  const tour = $("otto-tour");
  const bot = $("otto-bot");
  const msgs = $("otto-msgs");
  const thinkEl = $("otto-thinking");
  const tiltEl = $("otto-tilt");
  const eyeL = $("otto-eye-l");
  const eyeR = $("otto-eye-r");

  function openBubble() { bubble.classList.add("otto-open"); bubbleOpen = true; scrollMsgsToBottom(); }
  function closeBubble() { bubble.classList.remove("otto-open"); bubbleOpen = false; }
  function toggleBubble() {
    hideIdleGreeting();
    if (!greeted) { greet(); return; }
    bubbleOpen ? closeBubble() : openBubble();
  }

  let idleGreetTimer = null;
  function showIdleGreeting() {
    if (greeted) return;
    greetEl.textContent = IDLE_GREETINGS[Math.floor(Math.random() * IDLE_GREETINGS.length)];
    greetEl.classList.add("show");
    idleGreetTimer = setTimeout(hideIdleGreeting, 6000);
  }
  function hideIdleGreeting() { clearTimeout(idleGreetTimer); greetEl.classList.remove("show"); }

  function pushMsg(from, text) {
    const row = document.createElement("div");
    row.className = "otto-msg-row " + from;
    const b = document.createElement("div");
    b.className = "otto-msg-bubble " + from;
    b.textContent = text;
    row.appendChild(b);
    msgs.appendChild(row);
    scrollMsgsToBottom();
  }
  function typeMsg(text, onDone) {
    const row = document.createElement("div");
    row.className = "otto-msg-row bot";
    const b = document.createElement("div");
    b.className = "otto-msg-bubble bot";
    row.appendChild(b);
    msgs.appendChild(row);
    scrollMsgsToBottom();
    let i = 0;
    const speed = 18;
    function tick() {
      if (i < text.length) {
        b.textContent += text[i++];
        scrollMsgsToBottom();
        setTimeout(tick, speed);
      } else if (onDone) onDone();
    }
    tick();
  }
  function scrollMsgsToBottom() { msgs.scrollTop = msgs.scrollHeight; }

  function getChipLabel(key) {
    const found = CHIP_GROUPS.default.find((c) => c.key === key);
    return found ? found.label : key;
  }

  function greet() {
    if (greeted) return;
    greeted = true;
    typeMsg(`Hi! I'm ${BOT_NAME}, your guide here. Want the 20-second tour?`);
    openBubble();
  }

  function handleChip(key) {
    if (key === "tour") { startTour(); return; }
    const label = getChipLabel(key);
    pushMsg("user", label);
    thinkEl.classList.add("show");
    scrollMsgsToBottom();
    setTimeout(() => {
      thinkEl.classList.remove("show");
      typeMsg(ANSWERS[key] || "Hmm, I don't have that one yet!");
    }, 680);
  }

  // Tour — only include steps whose target exists in the current view
  function startTour() {
    closeBubble();
    steps = ALL_STEPS.filter((s) => document.querySelector(s.sel));
    if (!steps.length) return;
    tourActive = true;
    stepIndex = 0;
    tour.classList.add("active");
    tour.style.pointerEvents = "auto";
    goToStep(0);
  }
  function goToStep(i) {
    const step = steps[i];
    const el = document.querySelector(step.sel);
    if (el) {
      const r = el.getBoundingClientRect();
      const targetTop = window.scrollY + r.top - 150;
      window.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });
    }
    setTimeout(() => measureStep(), 480);
  }
  function measureStep() {
    const step = steps[stepIndex];
    if (!step) return;
    const el = document.querySelector(step.sel);
    if (!el) return;
    const r = el.getBoundingClientRect();
    const pad = 8;
    const spotlight = $("otto-spotlight");
    const tooltip = $("otto-tooltip");
    spotlight.style.cssText = `top:${r.top - pad}px;left:${r.left - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px;`;
    $("otto-step-title").textContent = step.title;
    $("otto-step-text").textContent = step.text;
    $("otto-step-label").textContent = `${stepIndex + 1} / ${steps.length}`;
    $("otto-tour-next").textContent = stepIndex >= steps.length - 1 ? "Done" : "Next";
    const tipW = 280;
    const below = r.top + r.height + 200 < window.innerHeight;
    const top = below ? r.top + r.height + 14 : Math.max(14, r.top - 14 - 170);
    const left = Math.min(Math.max(12, r.left), window.innerWidth - tipW - 12);
    tooltip.style.cssText = `top:${top}px;left:${left}px;width:${tipW}px;`;
  }
  function nextStep() {
    const ni = stepIndex + 1;
    if (ni >= steps.length) { endTour(); return; }
    stepIndex = ni;
    goToStep(ni);
  }
  function endTour() {
    tourActive = false;
    tour.classList.remove("active");
    tour.style.pointerEvents = "none";
    openBubble();
    setTimeout(() => pushMsg("bot", "That's the grand tour! Ping me whenever you need a hand. 👋"), 60);
  }

  // Mouse tracking eyes
  botRef = bot;
  window.addEventListener("mousemove", (e) => {
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
      rafId = null;
      mouse = { x: e.clientX, y: e.clientY };
      updateEyes();
    });
  });
  function updateEyes() {
    if (!mouse || !botRef) return;
    const r = botRef.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height * 0.42;
    const dx = mouse.x - cx, dy = mouse.y - cy;
    const dist = Math.hypot(dx, dy) || 1;
    const ox = (dx / dist) * Math.min(2, dist / 30);
    const oy = (dy / dist) * Math.min(2, dist / 30);
    const eyeXform = `translate(${ox.toFixed(2)}px, ${oy.toFixed(2)}px)`;
    eyeL.style.transform = eyeXform;
    eyeR.style.transform = eyeXform;
    eyeL.style.transition = eyeR.style.transition = "transform .1s ease";
    const t = Math.max(-4, Math.min(4, dx / 50));
    tiltEl.style.transform = `rotate(${t.toFixed(2)}deg)`;
    tiltEl.style.transition = "transform .25s ease";
  }

  const onScrollResize = () => { if (tourActive) measureStep(); };
  window.addEventListener("scroll", onScrollResize, true);
  window.addEventListener("resize", onScrollResize);

  $("otto-btn").addEventListener("click", toggleBubble);
  $("otto-close").addEventListener("click", closeBubble);
  $("otto-chips").addEventListener("click", (e) => {
    const chip = e.target.closest(".otto-chip");
    if (chip) handleChip(chip.dataset.key);
  });
  $("otto-tour-next").addEventListener("click", nextStep);
  $("otto-tour-skip").addEventListener("click", endTour);

  setTimeout(showIdleGreeting, 950);
})();
</script>
</body>
</html>
